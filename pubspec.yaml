name: zhige_flutter_tempate
description: "一个高质量的Flutter项目模板"
# 以下行防止使用 `flutter pub publish` 意外将软件包发布到 pub.dev。这对私有软件包是首选。
publish_to: 'none' # 如果您希望发布到 pub.dev，请删除此行

# 以下定义应用程序的版本和构建号。
# 版本号是由点分隔的三个数字，如 1.2.43
# 后跟可选的构建号，由 + 分隔。
# 版本和构建号都可以在 flutter build 中通过分别指定 --build-name 和 --build-number 来覆盖。
# 在 Android 中，build-name 用作 versionName，而 build-number 用作 versionCode。
# 有关 Android 版本控制的更多信息，请访问 https://developer.android.com/studio/publish/versioning
# 在 iOS 中，build-name 用作 CFBundleShortVersionString，而 build-number 用作 CFBundleVersion。
# 有关 iOS 版本控制的更多信息，请访问
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# 在 Windows 中，build-name 用作产品和文件版本的主要、次要和补丁部分，而 build-number 用作构建后缀。
version: 1.0.0+1

environment:
  sdk: ^3.7.2

# 依赖项指定您的软件包工作所需的其他软件包。
# 要自动将软件包依赖项升级到最新版本，
# 考虑运行 `flutter pub upgrade --major-versions`。或者，
# 可以通过将下面的版本号更改为 pub.dev 上可用的最新版本来手动更新依赖项。
# 要查看哪些依赖项有更新版本可用，请运行 `flutter pub outdated`。
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 以下添加了 Cupertino Icons 字体到您的应用程序。
  # 与 CupertinoIcons 类一起使用，用于 iOS 风格的图标。
  cupertino_icons: ^1.0.8
  extended_image: ^8.2.0
  flutter_markdown: ^0.6.18+2
  flutter_math_fork: ^0.7.2
  
  # 状态管理和依赖注入
  get: ^4.6.6
  
  # 数据库
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  
  # 网络请求
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.1
  
  # 身份验证
  # flutter_web_auth_2: ^2.2.1
  
  # 工具
  logger: ^2.0.2+1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.2
  package_info_plus: ^8.3.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 下面的 "flutter_lints" 包包含一组推荐的 lint 规则，
  # 鼓励良好的编码实践。该包提供的 lint 集在位于
  # 包根目录的 `analysis_options.yaml` 文件中激活。
  # 有关停用特定 lint 规则和激活其他规则的信息，请参阅该文件。
  flutter_lints: ^5.0.0
  
  # 代码生成
  build_runner: ^2.4.7
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1

# 有关此文件的通用 Dart 部分的信息，请参见以下页面：https://dart.dev/tools/pub/pubspec

# 以下部分仅针对 Flutter 包。
flutter:

  # 以下行确保 Material Icons 字体包含在您的应用程序中，
  # 以便您可以在 material Icons 类中使用图标。
  uses-material-design: true

  # 要向应用程序添加资源，请添加一个资源部分，如下所示：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 图像资源可以引用一个或多个特定分辨率的"变体"，
  # 请参见 https://flutter.dev/to/resolution-aware-images

  # 有关从包依赖项添加资源的详细信息，请参见
  # https://flutter.dev/to/asset-from-package

  # 要向应用程序添加自定义字体，请在此处添加一个字体部分，
  # 在这个"flutter"部分中。此列表中的每个条目都应具有一个
  # "family"键，带有字体系列名称，以及一个"fonts"键，带有
  # 提供资源和字体的其他描述符的列表。例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 有关包依赖项的字体的详细信息，
  # 请参见 https://flutter.dev/to/font-from-package

  # 添加资源
  assets:
    - assets/images/
    - assets/icons/

# 应用图标配置
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
